limit_req_zone $binary_remote_addr zone=pulse_login:10m rate=5r/m;
# The app shell names the hashed asset files of the current build, so it must never be cached.
# Every page route ends at /index.html (see try_files below), so the header is chosen by the file served.
map $uri $pulse_shell_cache {
    default "";
    /index.html "no-store";
}
server {
    listen 443 ssl;
    ssl_certificate /etc/pulse/tls/cert.pem;
    ssl_certificate_key /etc/pulse/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    # Keep every add_header here. A location that declares its own add_header stops inheriting
    # this list, which silently drops the security headers for whatever that location serves.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control $pulse_shell_cache;
    client_max_body_size 2m;
    location = / { return 302 /pulse; }
    location = /api/pulse/auth/login {
        limit_req zone=pulse_login burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # The report PDF: the browser posts the rendered pages (a few megabytes) and waits for the file.
    location = /api/admin/pulse/reports/pdf {
        client_max_body_size 12m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 150s;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 150s;
    }
    location /assets/ { try_files $uri =404; }
    location /images/ { try_files $uri =404; }
    location = /pulse { try_files /index.html =404; }
    location /pulse/ { try_files $uri /index.html; }
    location = /index.html { }
    location / { return 404; }
}
